meta:
  version: 1
  name: fbti-question-bank
  locale: zh-CN
  description: FBTI 题库、分型规则与 16 型结果文案统一配置

axes:
  - axis: I
    title: 投入强度
    leftCode: H
    rightCode: C
    leftLabel: 狂热型
    rightLabel: 松弛型
    defaultCode: C
    facetMapping:
      left: 抢口
      middle: 复盘
      right: 随缘
  - axis: S
    title: 相处方式
    leftCode: S
    rightCode: O
    leftLabel: 群体型
    rightLabel: 独处型
    defaultCode: O
    facetMapping:
      left: 组局
      middle: 搭子
      right: 守界
  - axis: T
    title: 偏好路径
    leftCode: T
    rightCode: G
    leftLabel: 技术流
    rightLabel: 装备流
    defaultCode: T
    facetMapping:
      left: 调校
      middle: 省事
      right: 配装
  - axis: R
    title: 价值取向
    leftCode: R
    rightCode: E
    leftLabel: 结果派
    rightLabel: 体验派
    defaultCode: E
    facetMapping:
      left: 胜负
      middle: 氛围
      right: 舒服

rules:
  resultIdAxisOrder: [I, S, T, R]
  tieBreakOrder: [score, strong, facet, default]
  allowedScoreKeys: [H, C, S, O, T, G, R, E]
  allowedFacetTags: [抢口, 复盘, 随缘, 组局, 搭子, 守界, 调校, 配装, 省事, 胜负, 舒服, 氛围]
  optionPositions: [left, middle, right]

questions:
  - id: 1
    axis: I
    text: 钓鱼前一晚会干嘛？
    options:
      - id: 1
        position: left
        text: 把装备整理好，设置闹钟，一睁眼就出发。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 看看明天天气和精神状态再决定去哪。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 睡到自然醒再说。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 2
    axis: I
    text: 突然出现一个傍晚黄金鱼口，你会？
    options:
      - id: 1
        position: left
        text: 推掉一切，去赶这个黄金窗口。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 如果本来没特殊安排会去，真有事就不去了。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 算了，按原计划安排。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 3
    axis: I
    text: 连续两次空军回来，你回家后的状态更像：
    options:
      - id: 1
        position: left
        text: 越想越上头，开始复盘原因：位置、天气、鱼情、技巧。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 回偶尔想一下哪里不对，不会刻意复盘。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 空军就空军，过两天想去了再去。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 4
    axis: I
    text: 明天清晨会有短口，但可能降温走水，你会：
    options:
      - id: 1
        position: left
        text: 果断去，值得一试。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 起来了就去，不起来也不强求自己。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 天气这样，不折腾了。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 5
    axis: I
    text: 好不容易搞了一条大鱼脱钩了，你会？
    options:
      - id: 1
        position: left
        text: 夜不能寐，反复琢磨哪个环节出问题了，
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 拍大腿，继续干。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 说明和这条鱼没缘分。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 6
    axis: S
    text: 到钓点第一件事：
    options:
      - id: 1
        position: left
        text: 先看看有没有钓友，顺便去聊聊，兄弟口咋样啊。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 跟认识的人聊两句，不认识的就算了。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 先找个安静钓位，抓紧时间下杆
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 7
    axis: S
    text: 有朋友约你一起去一个地方钓鱼
    options:
      - id: 1
        position: left
        text: 直接开始张罗时间、地点、谁带什么，把局组起来。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 看情况，一般会看熟悉程度和钓点位置。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 还是一个人自己钓爽。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 8
    axis: S
    text: 你自己这边狂口，旁边钓友一直没动静，你会：
    options:
      - id: 1
        position: left
        text: 和他分享下调漂方案和饵料和鱼获
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 偶尔会提醒一句关键技巧。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 大多时候各钓各的，除非他主动来问。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 9
    axis: S
    text: 钓着钓着，旁边人开始一直跟你聊天，你的真实反应更像：
    options:
      - id: 1
        position: left
        text: 挺好，边聊边钓更有感觉。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 短聊没问题，注意力都在漂上。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 会有点烦，不想接话。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 10
    axis: S
    text: 收杆之后，如果大家说找地方坐坐继续聊，你通常会：
    options:
      - id: 1
        position: left
        text: 大概率加入，钓完再聊一轮，整天才算完整。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 看当天状态，有兴致就坐一会儿，没兴致就先撤。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 更想直接回家，今天的社交额度在水边差不多已经用完了。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 11
    axis: T
    text: 陌生水域下杆半小时没动静，你会？
    options:
      - id: 1
        position: left
        text: 从位置、饵料、水层和手法一点点试，找问题在哪。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 先不调整，说不定下一杆就中鱼了。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 拿探鱼器看看鱼有没有进窝，或者再支一根鱼竿。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 12
    axis: T
    text: 手里有米，你会：
    options:
      - id: 1
        position: left
        text: 买些能帮我练判断和提升打法的东西，最好直接作用在技术上。（待改）
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 只要不影响上鱼，装备够用就行。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 终于可以升级一直想换的竿、轮、箱、包了。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 13
    axis: T
    text: 你平时爱刷的视频内容：
    options:
      - id: 1
        position: left
        text: 钓位选择、鱼情分析、调漂技巧、饵料搭配等。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 钓鱼独居，荒野钓鱼挑战，钓鱼比赛。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 钓鱼装备评测、开箱、对比等。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 14
    axis: T
    text: 到了一个新钓点，你是？
    options:
      - id: 1
        position: left
        text: 先观察钓位，水深，障碍物等
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 看看旁边有没有钓友，去问问了解一下情况。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 拿设备看看有没有鱼。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 15
    axis: T
    text: 平常不钓鱼的时候你会：
    options:
      - id: 1
        position: left
        text: 心里一直想着下次去哪儿钓。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 专心干正经事。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 总感觉自己的装备不够用，好想剁手。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 16
    axis: R
    text: 什么决定你收不收杆：
    options:
      - id: 1
        position: left
        text: 没搞大大鱼，再守一会儿。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 看当下感觉，尽兴了就收。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 差不多就行，别太累。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 17
    axis: R
    text: 旁边钓友突然连杆，你心里反应是：
    options:
      - id: 1
        position: left
        text: 我会立刻躁动起来，心里想问题出在哪里。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 哥们，你用的啥饵料？
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 他上他的，我钓我的
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 18
    axis: R
    text: 今天天气温度都挺舒服，但是一直没什么口，你会：
    options:
      - id: 1
        position: left
        text: 舒服归舒服，没上鱼还是不甘心，再守守看。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 钓到差不多时候了，就回去吧。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 享受在那一坐，整个人舒服的感觉。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 19
    axis: R
    text: 让你印象深刻的一个画面：
    options:
      - id: 1
        position: left
        text: 一次爆护，成为了最靓的仔。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 和几个钓友一起钓鱼，大家都很开心。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 在一个风景如画，景色绝佳的地方钓鱼。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 20
    axis: R
    text: 什么决定你下次还来这个钓点：
    options:
      - id: 1
        position: left
        text: 这里有没有机会让我爆护
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 今天这趟整体状态是不是在线，值不值得再来一次类似的局。（待改）
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 这里待着舒不舒服、顺不顺手，愿不愿意再来放松一天。（待改）
        scores: { E: 2 }
        facetScores: { 舒服: 2 }

resultTypes:
  - id: HOTR
    name: 钓帝
    image: /results/钓帝.png
    emoji: "🎯"
    title: 狂热 × 独处 × 技术 × 结果
    description: 你对钓鱼有很强的掌控欲，喜欢把鱼情、节奏和手法拆成一套能复盘的系统。你愿意投入时间独自打磨细节，目标很明确，就是把结果握在自己手里。
    traits: [控场型, 复盘脑, 独处专注, 胜负明确]
    dimensions: [狂热型, 独处型, 技术流, 结果派]
    signature: 我不赌运气，我只相信控制感。
    scene: 清晨黑坑边，你把装备一字排开，低头调漂、抬头盯水，像在指挥一场只属于自己的战斗。
  - id: HOTE
    name: 守钓宗师
    image: /results/守钓宗师.png
    emoji: "🌫️"
    title: 狂热 × 独处 × 技术 × 体验
    description: 你对钓鱼同样认真，但认真并不一定指向爆护。你更在意观察水、理解鱼情、感受节奏，技术是你和环境建立连接的方式。
    traits: [沉浸型, 观察欲强, 独处感知, 过程优先]
    dimensions: [狂热型, 独处型, 技术流, 体验派]
    signature: 我不是来征服鱼的，我是来靠近水的。
    scene: 山间溪流薄雾未散，你一个人坐在石头上守着浮漂，周围安静得只剩水声和呼吸。
  - id: HOGR
    name: 钓位终结者
    image: /results/钓位终结者.png
    emoji: "🧰"
    title: 狂热 × 独处 × 装备 × 结果
    description: 你相信好结果不是等来的，而是靠整套装备体系一点点堆出来的。器材、配件、线组和细节优化都服务于同一件事，那就是提高胜率。
    traits: [体系控, 配置党, 独处执行, 稳定输出]
    dimensions: [狂热型, 独处型, 装备流, 结果派]
    signature: 这不是乱花钱，这是把胜率拉满。
    scene: 钓位前高端装备整齐展开，鱼护满满，你站在中间，像把一整套战斗体系铺在水边。
  - id: HOGE
    name: 孤钓收藏家
    image: /results/孤钓收藏家.png
    emoji: "🪞"
    title: 狂热 × 独处 × 装备 × 体验
    description: 你迷恋的不只是鱼口，更是器材、搭配和氛围组成的完整 setup。对你来说，钓鱼是一种精致的个人秩序，鱼获只是这套秩序里的附加奖励。
    traits: [审美控, 收藏欲, 独处沉迷, 氛围优先]
    dimensions: [狂热型, 独处型, 装备流, 体验派]
    signature: 鱼只是背景，这套装备才是主角。
    scene: 傍晚湖边，你慢慢擦拭钓竿，把每个部件摆放整齐，像在照看一件只属于自己的作品。
  - id: HSTR
    name: 坑冠
    image: /results/坑冠.png
    emoji: "👑"
    title: 狂热 × 社交 × 技术 × 结果
    description: 你不只是会钓，还很会带节奏。技术、判断和存在感同时在线，别人会下意识把你的状态当成场上的风向标。
    traits: [带局型, 技术压制, 社交核心, 结果拉满]
    dimensions: [狂热型, 群体型, 技术流, 结果派]
    signature: 你们钓鱼，我控局。
    scene: 钓场中央，周围围着人，你一边上鱼一边点评鱼情，整场气氛和节奏都在跟着你走。
  - id: HSTE
    name: 水边讲师
    image: /results/水边讲师.png
    emoji: "🎙️"
    title: 狂热 × 社交 × 技术 × 体验
    description: 你把钓鱼当成一场可以不断交流和拆解的认知活动。你很享受分享判断、讨论变化、把一件事讲明白的过程，而不是单纯比谁鱼多。
    traits: [分享型, 表达欲强, 技术交流, 认知驱动]
    dimensions: [狂热型, 群体型, 技术流, 体验派]
    signature: 鱼获会过去，认知会留下来。
    scene: 湖边草地上，你一边抛竿一边讲鱼情变化，朋友还没上鱼，先被你上了一课。
  - id: HSGR
    name: 满配钓王
    image: /results/满配钓王.png
    emoji: "🚀"
    title: 狂热 × 社交 × 装备 × 结果
    description: 你最擅长把资源和装备配置变成整队的优势。自己上鱼当然重要，但更爽的是你一出手，朋友们也跟着一起爆护。
    traits: [资源型, 带飞欲强, 装备输出, 团队结果]
    dimensions: [狂热型, 群体型, 装备流, 结果派]
    signature: 你们负责开竿，我负责把胜率配齐。
    scene: 你给朋友分装备、配线组、盯细节，最后一群人鱼护都满了，你笑得比谁都早。
  - id: HSGE
    name: 海王
    image: /results/海王.png
    emoji: "🔥"
    title: 狂热 × 社交 × 装备 × 体验
    description: 你对一场局的投入一点不轻，只是你最在意的不是鱼，而是气氛、排面和参与感。对你来说，钓鱼是载体，把人聚舒服才是正事。
    traits: [组局型, 氛围担当, 装备排面, 情绪价值]
