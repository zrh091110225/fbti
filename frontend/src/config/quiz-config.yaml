meta:
  version: 1
  name: fbti-question-bank
  locale: zh-CN
  description: FBTI 题库、分型规则与 16 型结果文案统一配置

axes:
  - axis: I
    title: 投入强度
    leftCode: H
    rightCode: C
    leftLabel: 狂热型
    rightLabel: 松弛型
    defaultCode: C
    facetMapping:
      left: 抢口
      middle: 复盘
      right: 随缘
  - axis: S
    title: 相处方式
    leftCode: S
    rightCode: O
    leftLabel: 群体型
    rightLabel: 独处型
    defaultCode: O
    facetMapping:
      left: 组局
      middle: 搭子
      right: 守界
  - axis: T
    title: 偏好路径
    leftCode: T
    rightCode: G
    leftLabel: 技术流
    rightLabel: 装备流
    defaultCode: T
    facetMapping:
      left: 调校
      middle: 省事
      right: 配装
  - axis: R
    title: 价值取向
    leftCode: R
    rightCode: E
    leftLabel: 结果派
    rightLabel: 体验派
    defaultCode: E
    facetMapping:
      left: 胜负
      middle: 氛围
      right: 舒服

rules:
  resultIdAxisOrder: [I, S, T, R]
  tieBreakOrder: [score, strong, facet, default]
  allowedScoreKeys: [H, C, S, O, T, G, R, E]
  allowedFacetTags: [抢口, 复盘, 随缘, 组局, 搭子, 守界, 调校, 配装, 省事, 胜负, 舒服, 氛围]
  optionPositions: [left, middle, right]

questions:
  - id: 1
    axis: I
    text: 钓鱼前一晚会干嘛？
    options:
      - id: 1
        position: left
        text: 把装备整理好，设置闹钟，一睁眼就出发。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 看看明天天气和精神状态再决定去哪。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 睡到自然醒再说。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 2
    axis: I
    text: 突然出现一个傍晚黄金鱼口，你会？
    options:
      - id: 1
        position: left
        text: 推掉一切，去赶这个黄金窗口。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 如果本来没特殊安排会去，真有事就不去了。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 算了，按原计划安排。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 3
    axis: I
    text: 连续两次空军回家后：
    options:
      - id: 1
        position: left
        text: 越想越上头，开始复盘原因：位置、天气、鱼情、技巧。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 回偶尔想一下哪里不对，不会刻意复盘。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 空军就空军，过两天想去了再去。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 4
    axis: I
    text: 明早有短口，但可能降温，你会？
    options:
      - id: 1
        position: left
        text: 果断去，值得一试。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 起来了就去，不起来也不强求自己。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 天气这样，不折腾了。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 5
    axis: I
    text: 好不容易搞了一条大鱼脱钩了：
    options:
      - id: 1
        position: left
        text: 夜不能寐，反复琢磨哪个环节出问题了，
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 拍大腿，继续干。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 说明和这条鱼没缘分。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 6
    axis: S
    text: 达到钓点后：
    options:
      - id: 1
        position: left
        text: 先看看有没有钓友，去聊聊口咋样。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 跟认识的人聊两句，不认识的就算了。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 先找个安静钓位，抓紧时间下杆
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 7
    axis: S
    text: 有钓友约你一起去钓鱼：
    options:
      - id: 1
        position: left
        text: 直接开始张罗时间、地点、谁带什么，把局组起来。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 看情况，一般会看熟悉程度和钓点位置。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 还是一个人自己钓爽。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 8
    axis: S
    text: 你自己狂口，旁边钓友一直没动静，你会？
    options:
      - id: 1
        position: left
        text: 和他分享下调漂方案和饵料和鱼获
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 偶尔会提醒一句关键技巧。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 大多时候各钓各的，除非他主动来问。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 9
    axis: S
    text: 钓着钓着，旁边人开始一直跟你聊天：
    options:
      - id: 1
        position: left
        text: 挺好，边聊边钓更有感觉。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 短聊没问题，注意力都在漂上。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 会有点烦，不想接话。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 10
    axis: S
    text: 你偶然发现一个很好的私藏钓点
    options:
      - id: 1
        position: left
        text: 第一时间发给朋友，最好还能组个局一起去。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 只告诉一两个熟人。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 先自己留着，不太想让太多人知道
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 11
    axis: T
    text: 下杆半小时没动静，你会？
    options:
      - id: 1
        position: left
        text: 从位置、饵料、水层和手法一点点试，找问题在哪。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 先不调整，说不定下一杆就中鱼了。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 拿探鱼器看看鱼有没有进窝，或者再支一根鱼竿。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 12
    axis: T
    text: 手里有米，你会？
    options:
      - id: 1
        position: left
        text: 提升各种钓鱼技术
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 只要不影响上鱼，装备够用就行。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 终于可以升级新的竿、轮、箱、包了。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 13
    axis: T
    text: 你平时爱刷的视频内容：
    options:
      - id: 1
        position: left
        text: 钓位选择、鱼情分析、调漂技巧、饵料搭配等。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 钓鱼独居，荒野钓鱼挑战，钓鱼比赛。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 钓鱼装备评测、开箱、对比等。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 14
    axis: T
    text: 到了一个新钓点你会：
    options:
      - id: 1
        position: left
        text: 先观察钓位，水深，障碍物。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 看看旁边有没有钓友，去问问了解一下情况。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 拿设备看看有没有鱼。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 15
    axis: T
    text: 平常不钓鱼的时候你会：
    options:
      - id: 1
        position: left
        text: 心里一直想着下次去哪儿钓。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 专心干正经事。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 总感觉自己的装备不够用，好想剁手。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 16
    axis: R
    text: 什么决定你收不收杆：
    options:
      - id: 1
        position: left
        text: 没搞大大鱼，再守一会儿。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 看当下感觉，尽兴了就收。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 差不多就行，别太累。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 17
    axis: R
    text: 旁边钓友突然连杆，你心里反应是：
    options:
      - id: 1
        position: left
        text: 我会立刻躁动起来，心里想问题出在哪里。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 哥们，你用的啥饵料？
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 他上他的，我钓我的
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 18
    axis: R
    text: 今天天气温度都挺舒服，但是一直没什么口，你会：
    options:
      - id: 1
        position: left
        text: 舒服归舒服，没上鱼还是不甘心，再守守看。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 钓到差不多时候了，就回去吧。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 享受在那一坐，整个人舒服的感觉。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 19
    axis: R
    text: 让你印象深刻的一个画面：
    options:
      - id: 1
        position: left
        text: 一次爆护，成为了最靓的仔。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 和几个钓友一起钓鱼，大家都很开心。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 在一个风景如画，景色绝佳的地方钓鱼。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 20
    axis: R
    text: 朋友圈或者群里你会发：
    options:
      - id: 1
        position: left
        text: 鱼获
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 钓鱼的美好瞬间
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 钓鱼的风景
        scores: { E: 2 }
        facetScores: { 舒服: 2 }

resultTypes:
  - id: HOTR
    name: 钓帝
    image: /results/钓帝.png
    emoji: "🎯"
    title: 狂热 × 独处 × 技术 × 结果
    description: 你正以造物主的视角俯瞰这一场注定的终局。你对钓鱼的狂热，是对“控制感”近乎偏执的修证。你的钓位是你的祭坛，是你的因果发生器，是神圣不可侵犯的意志结界。每一竿的落点、每一抛的节奏，都是你在剥离世界的随机性，将“可能”强行扭转为“必然”。你不信神明，你只相信由你亲手书写的秩序。意志的输出与结果的回收保持着百分之百的能量转化，才构成了这极致的掌控，运气为何求？
    traits: [控场型, 复盘脑, 独处专注, 胜负明确]
    dimensions: [狂热型, 独处型, 技术流, 结果派]
    signature: 我不赌运气，我只相信控制感。
    scene: 清晨黑坑边，你把装备一字排开，低头调漂、抬头盯水，像在指挥一场只属于自己的战斗。
  - id: HOTE
    name: 守钓宗师
    image: /results/守钓宗师.png
    emoji: "🌫️"
    title: 狂热 × 独处 × 技术 × 体验
    description: 你早已在山川草木间修成了正果。你已然看透了“爆护”的虚妄，不愿让世俗的喧嚣乱了这一场水边的清修。你的钓位，是你的结界，是你的化外之地，是万籁俱寂的绝对领域，容不下半点胜负欲的侵扰。技术在你手中，不再是猎杀的钢叉，而是与水灵感应的法器。你不需要拉力值的快感，因为你追求的是行星入轨般的秩序感：鱼在深渊，你在岸边，你们之间保持着一根线的张力，才构成这和谐的宇宙。鱼获会过去，但这片水域的呼吸，才是你永恒的道场。
    traits: [沉浸型, 观察欲强, 独处感知, 过程优先]
    dimensions: [狂热型, 独处型, 技术流, 体验派]
    signature: 我不是来征服鱼的，我是来靠近水的。
    scene: 山间溪流薄雾未散，你一个人坐在石头上守着浮漂，周围安静得只剩水声和呼吸。
  - id: HOGR
    name: 钓位终结者
    image: /results/钓位终结者.png
    emoji: "🧰"
    title: 狂热 × 独处 × 装备 × 结果
    description: 你从不迷信神话，你只服从于器材参数堆砌出的暴力美学。你的钓位是你的军械库，是你的精密工业展厅，是拒绝一切随机性的暴力结界。每一套线组的拉力值、每一支碳竿的锥度，都是你与鱼情博弈的筹码。你不需要解释，因为结果就是最有力的宣言。工业文明的精密与自然野性的博弈保持着最冷酷的平衡，才构成这满护的终局，空军为何意？
    traits: [体系控, 配置党, 独处执行, 稳定输出]
    dimensions: [狂热型, 独处型, 装备流, 结果派]
    signature: 这不是乱花钱，这是把胜率拉满。
    scene: 钓位前高端装备整齐展开，鱼护满满，你站在中间，像把一整套战斗体系铺在水边。
  - id: HOGE
    name: 孤钓收藏家
    image: /results/收藏家.png
    emoji: "🪞"
    title: 狂热 × 独处 × 装备 × 体验
    description: 鱼获对你而言不过是点缀，那些闪烁着机械光泽的卷线器、温润如玉的漆面才是你清修的本尊。你的钓位是你的私人博物馆，是你的审美避风港，是尘世喧嚣之外的艺术孤岛。擦拭与摆放，是你与世界沟通的唯一礼仪。你不需要旁观者的赞叹，因为在你的微观世界里，器物与光影的交织才构成了生命的秩序，鱼上钩与否，又怎能破得了这精致的道行？
    traits: [审美控, 收藏欲, 独处沉迷, 氛围优先]
    dimensions: [狂热型, 独处型, 装备流, 体验派]
    signature: 鱼只是背景，这套装备才是主角。
    scene: 傍晚湖边，你慢慢擦拭钓竿，把每个部件摆放整齐，像在照看一件只属于自己的作品。
  - id: HSTR
    name: 坑冠
    image: /results/坑冠.png
    emoji: "👑"
    title: 狂热 × 社交 × 技术 × 结果
    description: 你不仅在垂钓，你是在这一方池塘里公然布道。你的周围是你的磁场，是你的演讲台，是让所有对手心生敬畏的统治领域。每一个上鱼的频率，都是你对节奏精准拿捏的音符。你不屑于低调，因为在你的世界观里，强者本就该在聚光灯下定义规则。高超的技术与如影随形的追随者保持着某种同频震动，才构成这沸腾的局势，孤独为何用？
    traits: [带局型, 技术压制, 社交核心, 结果拉满]
    dimensions: [狂热型, 群体型, 技术流, 结果派]
    signature: 你们钓鱼，我控局。
    scene: 钓场中央，周围围着人，你一边上鱼一边点评鱼情，整场气氛和节奏都在跟着你走。
  - id: HSTE
    name: 水边讲师
    image: /results/水边讲师.png
    emoji: "🎙️"
    title: 狂热 × 社交 × 技术 × 体验
