meta:
  version: 1
  name: fbti-question-bank
  locale: zh-CN
  description: FBTI 题库、分型规则与 16 型结果文案统一配置

axes:
  - axis: I
    title: 投入强度
    leftCode: H
    rightCode: C
    leftLabel: 狂热型
    rightLabel: 松弛型
    defaultCode: C
    facetMapping:
      left: 抢口
      middle: 复盘
      right: 随缘
  - axis: S
    title: 相处方式
    leftCode: S
    rightCode: O
    leftLabel: 群体型
    rightLabel: 独处型
    defaultCode: O
    facetMapping:
      left: 组局
      middle: 搭子
      right: 守界
  - axis: T
    title: 偏好路径
    leftCode: T
    rightCode: G
    leftLabel: 技术流
    rightLabel: 装备流
    defaultCode: T
    facetMapping:
      left: 调校
      middle: 省事
      right: 配装
  - axis: R
    title: 价值取向
    leftCode: R
    rightCode: E
    leftLabel: 结果派
    rightLabel: 体验派
    defaultCode: E
    facetMapping:
      left: 胜负
      middle: 氛围
      right: 舒服

rules:
  resultIdAxisOrder: [I, S, T, R]
  tieBreakOrder: [score, strong, facet, default]
  allowedScoreKeys: [H, C, S, O, T, G, R, E]
  allowedFacetTags: [抢口, 复盘, 随缘, 组局, 搭子, 守界, 调校, 配装, 省事, 胜负, 舒服, 氛围]
  optionPositions: [left, middle, right]

questions:
  - id: 1
    axis: I
    text: 周末只有半天空着，你前一晚通常会怎么准备？
    options:
      - id: 1
        position: left
        text: 前一晚就把闹钟、钓位和装备全安排好，最好一睁眼就能走。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 大方向先想好，真出门前再看天气和精神状态决定细节。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 先睡饱再说，醒来有感觉就去，没感觉就改天。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 2
    axis: I
    text: 工作日突然出现一个傍晚黄金鱼口，你更像哪种人？
    options:
      - id: 1
        position: left
        text: 能推的局就推，饭也能晚点吃，先去占这个窗口。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 如果本来没硬安排，我会去；真有事也不会为了鱼口硬改。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 算了，今天就按原计划走，钓鱼留给更从容的时候。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 3
    axis: I
    text: 连续两次空军回来，你回家后的状态更像：
    options:
      - id: 1
        position: left
        text: 越想越上头，回去就开始查天气、水情和别人怎么打的。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 会回想一下哪里不对，但不会立刻把自己拧进复盘模式。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 先放着，空军就空军，过两天想去了再说。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 4
    axis: I
    text: 明知第二天可能降温走水，但有人说清晨会有短口，你会：
    options:
      - id: 1
        position: left
        text: 还是去，哪怕只赌那一小段时间，也值得试。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 看起床状态，起来了就去，不起来也不强求自己。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 直接不折腾，天气都这样了，不如等更稳的天。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 5
    axis: I
    text: 一场钓完回到家，什么最容易让你忍不住继续想着这件事？
    options:
      - id: 1
        position: left
        text: 哪个环节差一点就能更好，我会反复琢磨。
        scores: { H: 2 }
        facetScores: { 抢口: 2 }
      - id: 2
        position: middle
        text: 会顺手记一下感受，但不会让它占满后半天。
        scores: { H: 1, C: 1 }
        facetScores: { 复盘: 2 }
      - id: 3
        position: right
        text: 洗完装备这事基本就翻篇了，今天过去就过去。
        scores: { C: 2 }
        facetScores: { 随缘: 2 }
  - id: 6
    axis: S
    text: 你到钓点刚把车停好，第一反应通常是：
    options:
      - id: 1
        position: left
        text: 先看看熟人都在哪，顺便打个招呼，场子热起来再说。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 跟认识的人点个头，聊两句，但还是先把自己位置安顿好。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 先找个安静钓位把自己放进去，不太想一到场就社交。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 7
    axis: S
    text: 朋友说“明天一起钓，我跟着你走”，你一般会：
    options:
      - id: 1
        position: left
        text: 直接开始张罗时间、地点、谁带什么，顺手把局组起来。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 可以一起，但更像各钓各的，路上和收杆后再慢慢聊。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 更想分开行动，到点见或者各玩各的都行。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 8
    axis: S
    text: 你发现自己这边有口，旁边朋友一直没动静，你会：
    options:
      - id: 1
        position: left
        text: 马上喊他过来，顺手把漂深、饵料和点位都讲给他。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 会提醒一句关键变化，剩下让他自己判断怎么接。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 大多时候先不打断彼此节奏，除非他主动来问。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 9
    axis: S
    text: 钓着钓着，旁边人开始一直跟你聊天，你的真实反应更像：
    options:
      - id: 1
        position: left
        text: 挺好，边聊边钓更有感觉，气氛起来了口差点也无所谓。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 短聊没问题，但真到关键窗口我还是会把注意力收回来。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 会有点烦，我来水边就是想安静待着，不想一直接话。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 10
    axis: S
    text: 收杆之后，如果大家说找地方坐坐继续聊，你通常会：
    options:
      - id: 1
        position: left
        text: 大概率加入，钓完再聊一轮，整天才算完整。
        scores: { S: 2 }
        facetScores: { 组局: 2 }
      - id: 2
        position: middle
        text: 看当天状态，有兴致就坐一会儿，没兴致就先撤。
        scores: { S: 1, O: 1 }
        facetScores: { 搭子: 2 }
      - id: 3
        position: right
        text: 更想直接回家，今天的社交额度在水边差不多已经用完了。
        scores: { O: 2 }
        facetScores: { 守界: 2 }
  - id: 11
    axis: T
    text: 陌生水域下杆半小时没动静，你最先会动哪一块？
    options:
      - id: 1
        position: left
        text: 先从线组、饵料、层次和手法一点点试，找问题在哪。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 先做最省事的微调，能不大拆就不大拆，边钓边试。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 先检查是不是装备配置不对，必要时直接换更合适的家伙。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 12
    axis: T
    text: 手里突然多出一笔钓鱼预算，你第一反应是：
    options:
      - id: 1
        position: left
        text: 买些能帮我练判断和提升打法的东西，最好直接作用在技术上。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 先补最缺的那点，别让装备和打法哪边拖后腿。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 终于可以升级一直想换的竿轮箱包了，配置先到位再说。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 13
    axis: T
    text: 你平时最愿意反复刷的内容，更像是：
    options:
      - id: 1
        position: left
        text: 拆鱼情、讲思路、教怎么判断的内容。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 那种既讲打法也讲配置，能直接抄回去用的内容。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 开箱、评测、器材搭配和 setup 展示。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 14
    axis: T
    text: 第一次去新钓点，你开局更像哪种人？
    options:
      - id: 1
        position: left
        text: 先观察水色、风向、深浅和别人节奏，再决定怎么打。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 先用自己最熟的一套开局，感觉不对再逐步调整。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 先把最适合这个场子的装备方案上齐，别一开始就吃配置亏。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 15
    axis: T
    text: 一趟钓完收拾装备时，你更容易把注意力放在：
    options:
      - id: 1
        position: left
        text: 今天哪些判断是对的，哪些动作还要修。
        scores: { T: 2 }
        facetScores: { 调校: 2 }
      - id: 2
        position: middle
        text: 先把东西收顺手，能复用的经验记住就够了，不用过度上纲。
        scores: { T: 1, G: 1 }
        facetScores: { 省事: 2 }
      - id: 3
        position: right
        text: 哪件装备顺不顺手、哪里该升级，下一次怎么搭更舒服。
        scores: { G: 2 }
        facetScores: { 配装: 2 }
  - id: 16
    axis: R
    text: 天色开始暗了，今天鱼获一般，你决定收不收杆时最看重：
    options:
      - id: 1
        position: left
        text: 再守一会儿，说不定最后还能把结果拉回来。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 看当下感觉，今天要是已经尽兴了，早点收也没什么。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 差不多就行，别把自己耗得太累，舒服收工更重要。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 17
    axis: R
    text: 旁边钓友突然连杆，你心里第一反应更像：
    options:
      - id: 1
        position: left
        text: 我会立刻紧起来，想知道问题出在哪，最好把差距追回来。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 会看看他在干嘛，也会调一调，但不至于马上进入较劲状态。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 替他开心一下就行，各有各的节奏，没必要把自己搞紧。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 18
    axis: R
    text: 今天一直没什么口，但天气、风和人都挺舒服，你会：
    options:
      - id: 1
        position: left
        text: 舒服归舒服，没结果还是不甘心，想再咬牙试一阵。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 如果同行的人状态也不错，我可能就顺着这份氛围慢慢收尾。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 那就当出来放空了，今天待得舒服本身就算赚到。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 19
    axis: R
    text: 回想一场“不错的出钓”，你最容易先记住的是：
    options:
      - id: 1
        position: left
        text: 最后到底钓了多少、有没有把目标打出来。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 那天整体节奏很顺，人和场子都对，回想起来很完整。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 那天人很松、风景很对、待着就是舒服，鱼反而没那么关键。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }
  - id: 20
    axis: R
    text: 如果问你“下次还想不想来这个钓点”，最影响答案的是：
    options:
      - id: 1
        position: left
        text: 这里有没有机会让我把成绩再往上拉。
        scores: { R: 2 }
        facetScores: { 胜负: 2 }
      - id: 2
        position: middle
        text: 今天这趟整体状态是不是在线，值不值得再来一次类似的局。
        scores: { R: 1, E: 1 }
        facetScores: { 氛围: 2 }
      - id: 3
        position: right
        text: 这里待着舒不舒服、顺不顺手，愿不愿意再来放松一天。
        scores: { E: 2 }
        facetScores: { 舒服: 2 }

resultTypes:
  - id: HOTR
    name: 八级钓帝
    image: /results/sample-personality-result.png
    emoji: "🎯"
    title: 狂热 × 独处 × 技术 × 结果
    description: 你对钓鱼有很强的掌控欲，喜欢把鱼情、节奏和手法拆成一套能复盘的系统。你愿意投入时间独自打磨细节，目标很明确，就是把结果握在自己手里。
    traits: [控场型, 复盘脑, 独处专注, 胜负明确]
    dimensions: [狂热型, 独处型, 技术流, 结果派]
    signature: 我不赌运气，我只相信控制感。
    scene: 清晨黑坑边，你把装备一字排开，低头调漂、抬头盯水，像在指挥一场只属于自己的战斗。
  - id: HOTE
    name: 守钓宗师
    image: /results/sample-personality-result.png
    emoji: "🌫️"
    title: 狂热 × 独处 × 技术 × 体验
    description: 你对钓鱼同样认真，但认真并不一定指向爆护。你更在意观察水、理解鱼情、感受节奏，技术是你和环境建立连接的方式。
    traits: [沉浸型, 观察欲强, 独处感知, 过程优先]
    dimensions: [狂热型, 独处型, 技术流, 体验派]
    signature: 我不是来征服鱼的，我是来靠近水的。
    scene: 山间溪流薄雾未散，你一个人坐在石头上守着浮漂，周围安静得只剩水声和呼吸。
  - id: HOGR
    name: 钓位终结者
    image: /results/sample-personality-result.png
    emoji: "🧰"
    title: 狂热 × 独处 × 装备 × 结果
    description: 你相信好结果不是等来的，而是靠整套装备体系一点点堆出来的。器材、配件、线组和细节优化都服务于同一件事，那就是提高胜率。
    traits: [体系控, 配置党, 独处执行, 稳定输出]
    dimensions: [狂热型, 独处型, 装备流, 结果派]
    signature: 这不是乱花钱，这是把胜率拉满。
    scene: 钓位前高端装备整齐展开，鱼护满满，你站在中间，像把一整套战斗体系铺在水边。
  - id: HOGE
    name: 孤钓收藏家
    image: /results/sample-personality-result.png
    emoji: "🪞"
    title: 狂热 × 独处 × 装备 × 体验
    description: 你迷恋的不只是鱼口，更是器材、搭配和氛围组成的完整 setup。对你来说，钓鱼是一种精致的个人秩序，鱼获只是这套秩序里的附加奖励。
    traits: [审美控, 收藏欲, 独处沉迷, 氛围优先]
    dimensions: [狂热型, 独处型, 装备流, 体验派]
    signature: 鱼只是背景，这套装备才是主角。
    scene: 傍晚湖边，你慢慢擦拭钓竿，把每个部件摆放整齐，像在照看一件只属于自己的作品。
  - id: HSTR
    name: 坑冠
    image: /results/sample-personality-result.png
    emoji: "👑"
    title: 狂热 × 社交 × 技术 × 结果
    description: 你不只是会钓，还很会带节奏。技术、判断和存在感同时在线，别人会下意识把你的状态当成场上的风向标。
    traits: [带局型, 技术压制, 社交核心, 结果拉满]
    dimensions: [狂热型, 群体型, 技术流, 结果派]
    signature: 你们钓鱼，我控局。
    scene: 钓场中央，周围围着人，你一边上鱼一边点评鱼情，整场气氛和节奏都在跟着你走。
  - id: HSTE
    name: 水边讲师
    image: /results/sample-personality-result.png
    emoji: "🎙️"
    title: 狂热 × 社交 × 技术 × 体验
    description: 你把钓鱼当成一场可以不断交流和拆解的认知活动。你很享受分享判断、讨论变化、把一件事讲明白的过程，而不是单纯比谁鱼多。
